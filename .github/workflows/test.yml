name: Test

on:
  pull_request:
  push:
    branches:
      - main

env:
  HUSKY: 0

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - "22.x"
          - "24.x"
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm type-check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm -C demo install --frozen-lockfile
      - run: pnpm -C demo lint
      - run: pnpm -C demo type-check
      - run: pnpm -C demo build
