name: Worker benchmark

on:
  pull_request:
    paths:
      - "benchmark/**"
      - ".github/workflows/benchmark.yml"
  workflow_dispatch:

env:
  HUSKY: 0

jobs:
  functional:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm -C benchmark install --frozen-lockfile
      - run: pnpm -C benchmark lint
      - run: pnpm -C benchmark type-check
      - run: pnpm -C benchmark build
      - run: pnpm -C benchmark exec playwright install --with-deps chromium firefox webkit
      - run: pnpm -C benchmark test:functional

  performance:
    name: performance (attempt ${{ matrix.attempt }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm -C benchmark install --frozen-lockfile
      - run: pnpm -C benchmark exec playwright install --with-deps chromium
      - run: pnpm -C benchmark benchmark:chromium
      - name: Print benchmark result
        run: >-
          node -e "const result = require('./benchmark/test-results/benchmark-results.json');
          console.log(JSON.stringify({ decision: result.decision, summaries: result.summaries }, null, 2))"
      - uses: actions/upload-artifact@v7
        with:
          name: worker-benchmark-${{ github.sha }}-attempt-${{ matrix.attempt }}
          path: benchmark/test-results/benchmark-results.json
          if-no-files-found: error
          retention-days: 30

  performance-gate:
    needs: performance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
      - uses: actions/download-artifact@v8
        with:
          pattern: worker-benchmark-${{ github.sha }}-attempt-*
          path: benchmark-artifacts
      - name: Evaluate cross-attempt gate
        run: node benchmark/scripts/evaluate-attempts.mjs benchmark-artifacts
