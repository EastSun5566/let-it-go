name: Worker benchmark functional checks

on:
  pull_request:
    paths:
      - "benchmark/**"
      - ".github/workflows/benchmark.yml"
  workflow_dispatch:

env:
  HUSKY: 0

jobs:
  functional:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm -C benchmark install --frozen-lockfile
      - run: pnpm -C benchmark lint
      - run: pnpm -C benchmark type-check
      - run: pnpm -C benchmark build
      - run: pnpm -C benchmark exec playwright install --with-deps chromium firefox webkit
      - run: pnpm -C benchmark test:functional
